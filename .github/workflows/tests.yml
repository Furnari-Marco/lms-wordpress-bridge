name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
      - name: Lint
        run: find . -name '*.php' -not -path './tests/fake-abspath/*' -print0 | xargs -0 -n1 php -l
      - name: Test
        run: php tests/run.php
